{% extends "base.html" %}
{% block title %}My account{% endblock %}
{% block mainclass %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h1>My account</h1>
  <p>{{ me.name }} · {{ me.email }}</p>
  {% if done %}<p class="flash">Password changed.</p>{% endif %}
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/account" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Current password <input name="current" type="password" required autocomplete="current-password"></label>
    <label>New password (at least 10 characters) <input name="new" type="password" minlength="10" required autocomplete="new-password"></label>
    <button class="btn">Change password</button>
  </form>
</div>
{% endblock %}
